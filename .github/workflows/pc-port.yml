name: PC port

# Builds the PC port for macOS and Windows on every push, so a change that
# breaks one platform is caught immediately rather than at release time.
#
# Artifacts are NOT uploaded by default.  The built executable has the game's
# graphics and audio compiled into it (that is what makes it ~20 MB), and a
# CI artifact on a public repository is downloadable by anyone who can read the
# repo — the same exposure as publishing a release. Run the workflow manually
# with "upload artifacts" checked if that is what you intend.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload built artifacts"
        type: boolean
        default: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2
      - name: Build app bundle
        run: make -f Makefile.pc -j$(sysctl -n hw.ncpu) app
      - name: Verify the bundle is self-contained
        run: |
          bin="dist/Rhythm Tengoku.app/Contents/MacOS/rhythmtengoku"
          test -x "$bin"
          otool -L "$bin" | grep -q '@executable_path/../Frameworks/libSDL2' \
            || { echo "SDL2 was not relocated into the bundle"; exit 1; }
      - name: Inspect the bundle
        run: |
          ls -l "dist/Rhythm Tengoku.app/Contents/Frameworks/"
          otool -L "dist/Rhythm Tengoku.app/Contents/MacOS/rhythmtengoku"
          file "dist/Rhythm Tengoku.app/Contents/MacOS/rhythmtengoku"
          echo "--- first 5 s of output, unfiltered ---"
          RTPC_HEADLESS=1 RTPC_TRACE=1 \
            "dist/Rhythm Tengoku.app/Contents/MacOS/rhythmtengoku" > early.log 2>&1 &
          sleep 5; kill $! 2>/dev/null || true
          echo "bytes: $(wc -c < early.log)"; cat early.log | head -20

      - name: Smoke test
        run: |
          # No display on the runner. SDL's dummy video driver is not enough —
          # it cannot create a renderer and the game then blocks — so use the
          # port's own headless mode, which skips window/renderer/audio and
          # runs everything above the platform layer: boot, the scene table,
          # the beatscript VM and the mixer, where breakage actually shows up.
          export RTPC_HEADLESS=1 RTPC_TRACE=1 RTPC_AUTO=2
          "dist/Rhythm Tengoku.app/Contents/MacOS/rhythmtengoku" > run.log 2>&1 &
          pid=$!
          sleep 40
          kill $pid 2>/dev/null || true
          if grep -q '\[CRASH\]' run.log; then
            echo "crashed:"; cat run.log; exit 1
          fi
          scenes=$(grep -c '\[SCENE\]' run.log || true)
          echo "scene transitions: $scenes"
          if [ "${scenes:-0}" -lt 5 ]; then
            echo "did not get past boot"; cat run.log; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: rhythmtengoku-macos
          path: dist/Rhythm Tengoku.app

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkg-config
      - name: Build
        # Built natively here rather than cross-compiled, so CC and the SDL2
        # flags are overridden; everything else in the win branch applies.
        run: |
          make -f Makefile.pc PLATFORM=win -j$(nproc) \
            CC=gcc LD=gcc \
            SDL2_CFLAGS="$(sdl2-config --cflags)" \
            SDL2_LIBS="$(sdl2-config --libs)"
      - name: Stage dist
        run: |
          mkdir -p dist/windows
          cp build/windows/rhythmtengoku.exe dist/windows/
          cp /mingw64/bin/SDL2.dll dist/windows/
      - name: Smoke test
        run: |
          file dist/windows/rhythmtengoku.exe || true
          export RTPC_HEADLESS=1 RTPC_TRACE=1 RTPC_AUTO=2
          # Launch through cmd: MSYS2's bash refused to exec the GUI-subsystem
          # binary directly ("Exec format error"), and cmd is what a user would
          # start it with anyway.
          cmd //c "dist\\windows\\rhythmtengoku.exe > run.log 2>&1" &
          pid=$!
          sleep 40
          kill $pid 2>/dev/null || true
          taskkill //IM rhythmtengoku.exe //F 2>/dev/null || true
          if grep -q '\[CRASH\]' run.log; then
            echo "crashed:"; cat run.log; exit 1
          fi
          scenes=$(grep -c '\[SCENE\]' run.log || true)
          echo "scene transitions: $scenes"
          if [ "${scenes:-0}" -lt 5 ]; then
            echo "did not get past boot"; cat run.log; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: rhythmtengoku-windows
          path: dist/windows
